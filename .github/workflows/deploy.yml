name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: npm install

      - name: Web Kodunu Derle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Android Ekle (Eğer yoksa)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: NFC İznini AndroidManifest.xml'e Ekle
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.NFC" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="true" />' "$MANIFEST"
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: personel-takip-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk